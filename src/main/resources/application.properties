# ==============================================================================
# CONFIGURACION BASE DE LA APLICACION
# ==============================================================================
spring.application.name=mi-spring-app

# Puerto del servidor web (utiliza la variable de entorno PORT o por defecto 8080)
server.port=${PORT:8080}

# Perfil activo por defecto (permite override por variable SPRING_PROFILES_ACTIVE)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ==============================================================================
# PERFIL DE PRODUCCION (PROD)
# PostgreSQL, validacion estricta de esquema y exposicion minima segura
# ==============================================================================

# Fuente de datos PostgreSQL externalizada con variables de entorno
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/appdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:postgres}

# Desactivar consola H2 en produccion por seguridad
spring.h2.console.enabled=false

# Configuracion JPA / Hibernate (solo validacion de esquema para integridad)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Niveles de Logging optimizados para produccion
logging.level.root=WARN
logging.level.com.universidad.miapp=INFO
logging.level.org.springframework.web=INFO

# Actuator: Exposicion minima restringida solo a salud e informacion
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ==============================================================================
# PERFIL DE DESARROLLO (DEV)
# Base de datos en memoria H2, auditoria y exposicion completa de endpoints
# ==============================================================================

# Fuente de datos H2 en memoria con soporte de variable de entorno
spring.datasource.url=${DATASOURCE_URL:jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DATASOURCE_USERNAME:sa}
spring.datasource.password=${DATASOURCE_PASSWORD:}

# Consola H2 para depuracion en desarrollo
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracion JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Niveles de Logging detallado para desarrollo
logging.level.root=INFO
logging.level.com.universidad.miapp=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Actuator: Exposicion de todos los endpoints para diagnostico
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
